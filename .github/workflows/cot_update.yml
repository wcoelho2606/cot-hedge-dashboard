name: Atualizar Dados COT Forex

on:
  schedule:
    - cron: '30 20 * * 5' # Roda toda sexta-feira às 20:30 UTC
  workflow_dispatch: # Permite rodar manualmente pelo painel

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Configurar tarefa
        uses: actions/checkout@v3

      - name: A ambiente Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Instalar bibliotecas permitidas
        run: |
          python -m pip install --upgrade pip
          pip install pandas requests cot_reports

      - name: Executar script de atualização
        run: python atualizar.py

      - name: Salvar alterações de volta no repositório
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
          git add .
          git status
          git diff-index --quiet HEAD || git commit -m "Auto-update: Dados COT Forex atualizados"
          git push
